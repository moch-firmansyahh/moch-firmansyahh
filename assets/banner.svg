<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 140" width="100%" height="100%">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#070A10"/>
    </linearGradient>
  </defs>

  <style>
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif;
    }
    .title {
      font-weight: 700;
      font-size: 26px;
      fill: #F8FAFC;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-weight: 400;
      font-size: 13.5px;
      fill: #94A3B8;
    }
    .location {
      font-weight: 400;
      font-size: 12px;
      fill: #64748B;
    }
    .status-text {
      font-weight: 500;
      font-size: 11px;
      fill: #4ADE80;
      letter-spacing: 0.2px;
    }
  </style>

  <!-- Container Box: Clean Dark Slate with 1px border -->
  <rect x="1" y="1" width="838" height="138" rx="8" fill="url(#bannerBg)" stroke="#1E293B" stroke-width="1"/>

  <!-- Left Accent Accent Line -->
  <rect x="1" y="24" width="3" height="92" rx="1.5" fill="#3B82F6"/>

  <g class="font-sans">
    <!-- Main Name -->
    <text x="36" y="52" class="title">Moch Firmansyah</text>

    <!-- Subtitle -->
    <text x="36" y="78" class="subtitle">Undergraduate Informatics Student · Web &amp; Full-Stack Developer</text>

    <!-- Location & Institution -->
    <g transform="translate(36, 106)">
      <!-- Minimalist Location Pin Icon -->
      <path d="M 0 4 C 0 1.8 1.8 0 4 0 C 6.2 0 8 1.8 8 4 C 8 7 4 11 4 11 C 4 11 0 7 0 4 Z M 3 4 C 3 4.6 3.4 5 4 5 C 4.6 5 5 4.6 5 4 C 5 3.4 4.6 3 4 3 C 3.4 3 3 3.4 3 4 Z" fill="#64748B"/>
      <text x="14" y="9" class="location">Telkom University, Bandung, Indonesia</text>
    </g>

    <!-- Status Pill: Open to collaboration -->
    <g transform="translate(642, 34)">
      <rect x="0" y="0" width="162" height="26" rx="13" fill="#041F14" stroke="#166534" stroke-width="1"/>
      <circle cx="14" cy="13" r="3.5" fill="#22C55E"/>
      <text x="26" y="17" class="status-text">Open to collaboration</text>
    </g>
  </g>
</svg>
