<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 78" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBgIn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="neonIn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A66C2"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="glowIn" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .platform-name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 15px; fill: #F8FAFC; letter-spacing: 0.5px; }
    .status-text { font-family: 'Courier New', monospace; font-weight: 600; font-size: 10px; fill: #4ADE80; letter-spacing: 1.5px; }
    .handle-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #64748B; }
  </style>

  <!-- Card Background -->
  <rect x="2" y="2" width="426" height="74" rx="10" fill="url(#cardBgIn)" stroke="#1E293B" stroke-width="1.5"/>
  
  <!-- Subtle Neon Outline -->
  <rect x="2" y="2" width="426" height="74" rx="10" fill="none" stroke="url(#neonIn)" stroke-width="1.2" stroke-opacity="0.85" filter="url(#glowIn)"/>

  <!-- Left Tech Accent Bar -->
  <path d="M 2 24 L 2 54" stroke="#0A66C2" stroke-width="3" stroke-linecap="round"/>

  <!-- Platform Icon: LinkedIn -->
  <g transform="translate(24, 22)">
    <rect width="32" height="32" rx="6" fill="#0A66C2"/>
    <path d="M7 12 h4 v14 h-4 z M9 6 a2.5 2.5 0 1 1 0 5 a2.5 2.5 0 0 1 0 -5 z M14 12 h3.8 v1.9 h0.1 c0.5-1 1.8-2.1 3.8-2.1 4.1 0 4.8 2.7 4.8 6.2 v8 h-4 v-7.1 c0-1.7 0-3.9-2.4-3.9 -2.4 0 -2.7 1.8 -2.7 3.7 v7.3 h-4 z" fill="#FFFFFF"/>
  </g>

  <!-- Platform Details -->
  <text x="72" y="34" class="platform-name">LinkedIn</text>
  <text x="145" y="34" class="handle-text">Moch Firmansyah</text>

  <!-- Status indicator row -->
  <g transform="translate(72, 48)">
    <circle cx="4" cy="4" r="3" fill="#4ADE80"/>
    <circle cx="4" cy="4" r="5" fill="none" stroke="#4ADE80" stroke-width="1" stroke-opacity="0.5"/>
    <text x="14" y="8" class="status-text">CONNECTED</text>
  </g>

  <!-- Right Arrow Icon -->
  <g transform="translate(390, 27)" stroke="#38BDF8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="0" y1="16" x2="16" y2="0"/>
    <polyline points="4 0 16 0 16 12"/>
  </g>
</svg>
