<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 60" width="100%" height="100%">
  <defs>
    <linearGradient id="connectGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="35%" stop-color="#EF4444"/>
      <stop offset="70%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <filter id="glowConnect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .connect-text {
      font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Courier New', sans-serif;
      font-weight: 900;
      letter-spacing: 4px;
      font-size: 20px;
      fill: #FFFFFF;
    }
    .mono {
      font-family: 'Courier New', monospace;
      font-size: 11px;
      letter-spacing: 2px;
      fill: #F59E0B;
      font-weight: 600;
    }
  </style>

  <!-- Left Tech Bracket Indicator -->
  <path d="M 5 12 L 0 12 L 0 35 L 5 35" fill="none" stroke="#F59E0B" stroke-width="2.5"/>
  <rect x="12" y="19" width="5" height="5" fill="#F59E0B"/>

  <!-- Title Text -->
  <text x="28" y="27" class="connect-text">CONNECT</text>
  <text x="155" y="26" class="mono">// ESTABLISHING UPLINK</text>

  <!-- Futuristic Gradient Underline -->
  <rect x="0" y="44" width="460" height="2.5" rx="1.25" fill="url(#connectGrad)" filter="url(#glowConnect)"/>
  <rect x="0" y="44" width="460" height="2" rx="1" fill="url(#connectGrad)"/>
  
  <!-- Circuit Nodes -->
  <circle cx="465" cy="45" r="2.5" fill="#EC4899"/>
  <line x1="470" y1="45" x2="500" y2="45" stroke="#334155" stroke-width="1" stroke-dasharray="3, 3"/>
  <circle cx="505" cy="45" r="1.5" fill="#64748B"/>
</svg>
