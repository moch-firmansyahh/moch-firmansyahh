<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 495 195" width="495px" height="195px">
  <defs>
    <filter id="ringGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Courier New', monospace; }
    .metric-title { font-weight: 700; font-size: 13px; fill: #38BDF8; letter-spacing: 0.5px; }
    .metric-url { font-size: 11px; fill: #64748B; letter-spacing: 0.2px; }
    .gauge-val { font-weight: 800; font-size: 13px; fill: #F8FAFC; }
    .gauge-lbl { font-size: 10px; fill: #94A3B8; font-weight: 500; }
  </style>

  <!-- Card Frame (Border removed for seamless blend matching streak stats) -->
  <rect x="0" y="0" width="495" height="195" fill="none"/>

  <!-- Header Row -->
  <g transform="translate(25, 28)">
    <!-- Rocket Icon -->
    <path d="M 12 1 C 12 1 18 5 18 11 C 18 15 15 18 11 20 L 8 17 L 10 13 L 7 10 L 3 12 L 0 9 C 2 5 5 2 9 2 Z M 5 19 L 2 22 M 2 16 L 0 18" fill="none" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="11" cy="8" r="1.5" fill="#38BDF8"/>
    
    <text x="28" y="10" class="mono metric-title">Core Web Vitals &amp; Engineering Standards</text>
    <text x="28" y="24" class="mono metric-url">🔗 github.com/moch-firmansyahh</text>
  </g>

  <!-- 4 Circular Gauges -->
  <!-- 1. Performance (98) -->
  <g transform="translate(68, 115)">
    <!-- Background Circle -->
    <circle cx="0" cy="0" r="28" fill="none" stroke="#1E293B" stroke-width="4.5"/>
    <!-- Value Circle (98% = 172.4 of 175.9) -->
    <circle cx="0" cy="0" r="28" fill="none" stroke="#10B981" stroke-width="4.5" stroke-dasharray="175.9" stroke-dashoffset="3.5" stroke-linecap="round" transform="rotate(-90)" filter="url(#ringGlow)"/>
    <text x="0" y="5" text-anchor="middle" class="mono gauge-val">98</text>
    <text x="0" y="44" text-anchor="middle" class="mono gauge-lbl">Performance</text>
  </g>

  <!-- 2. Accessibility (96) -->
  <g transform="translate(182, 115)">
    <!-- Background Circle -->
    <circle cx="0" cy="0" r="28" fill="none" stroke="#1E293B" stroke-width="4.5"/>
    <!-- Value Circle (96% = 168.8 of 175.9) -->
    <circle cx="0" cy="0" r="28" fill="none" stroke="#10B981" stroke-width="4.5" stroke-dasharray="175.9" stroke-dashoffset="7" stroke-linecap="round" transform="rotate(-90)" filter="url(#ringGlow)"/>
    <text x="0" y="5" text-anchor="middle" class="mono gauge-val">96</text>
    <text x="0" y="44" text-anchor="middle" class="mono gauge-lbl">Accessibility</text>
  </g>

  <!-- 3. Best Practices (100) -->
  <g transform="translate(296, 115)">
    <!-- Background Circle -->
    <circle cx="0" cy="0" r="28" fill="none" stroke="#1E293B" stroke-width="4.5"/>
    <!-- Value Circle (100% = 175.9 of 175.9) -->
    <circle cx="0" cy="0" r="28" fill="none" stroke="#10B981" stroke-width="4.5" stroke-dasharray="175.9" stroke-dashoffset="0" stroke-linecap="round" transform="rotate(-90)" filter="url(#ringGlow)"/>
    <text x="0" y="5" text-anchor="middle" class="mono gauge-val">100</text>
    <text x="0" y="44" text-anchor="middle" class="mono gauge-lbl">Best Practices</text>
  </g>

  <!-- 4. Code Quality / SEO (95) -->
  <g transform="translate(410, 115)">
    <!-- Background Circle -->
    <circle cx="0" cy="0" r="28" fill="none" stroke="#1E293B" stroke-width="4.5"/>
    <!-- Value Circle (95% = 167.1 of 175.9) -->
    <circle cx="0" cy="0" r="28" fill="none" stroke="#10B981" stroke-width="4.5" stroke-dasharray="175.9" stroke-dashoffset="8.8" stroke-linecap="round" transform="rotate(-90)" filter="url(#ringGlow)"/>
    <text x="0" y="5" text-anchor="middle" class="mono gauge-val">95</text>
    <text x="0" y="44" text-anchor="middle" class="mono gauge-lbl">SEO &amp; Quality</text>
  </g>
</svg>
