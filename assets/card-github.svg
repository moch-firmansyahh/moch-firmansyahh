<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 78" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBgGh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="neonGh" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="glowGh" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .platform-name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 15px; fill: #F8FAFC; letter-spacing: 0.5px; }
    .status-text { font-family: 'Courier New', monospace; font-weight: 600; font-size: 10px; fill: #4ADE80; letter-spacing: 1.5px; }
    .handle-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #64748B; }
  </style>

  <!-- Card Background -->
  <rect x="2" y="2" width="426" height="74" rx="10" fill="url(#cardBgGh)" stroke="#1E293B" stroke-width="1.5"/>
  
  <!-- Subtle Neon Outline / Corner Accents -->
  <rect x="2" y="2" width="426" height="74" rx="10" fill="none" stroke="url(#neonGh)" stroke-width="1.2" stroke-opacity="0.85" filter="url(#glowGh)"/>

  <!-- Left Tech Accent Bar -->
  <path d="M 2 24 L 2 54" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>

  <!-- Platform Icon: GitHub -->
  <g transform="translate(22, 21)" fill="#F8FAFC">
    <path d="M18 0C8.06 0 0 8.06 0 18c0 7.96 5.16 14.7 12.31 17.08.9.17 1.23-.39 1.23-.87 0-.43-.02-1.85-.02-3.37-4.48.82-5.65-1.09-6.01-2.09-.2-.51-1.07-2.09-1.83-2.51-.62-.33-1.52-1.16-.03-1.18 1.41-.02 2.42 1.3 2.76 1.84 1.61 2.72 4.19 1.95 5.22 1.48.16-1.16.63-1.95 1.14-2.4-3.99-.45-8.17-2-8.17-8.87 0-1.96.7-3.56 1.85-4.82-.18-.45-.8-2.28.18-4.75 0 0 1.5-.48 4.93 1.84 1.43-.4 2.97-.6 4.5-.6s3.07.2 4.5.6c3.42-2.33 4.92-1.84 4.92-1.84.99 2.47.37 4.3.18 4.75 1.15 1.25 1.85 2.85 1.85 4.82 0 6.9-4.2 8.41-8.2 8.86.65.56 1.22 1.64 1.22 3.32 0 2.4-.02 4.33-.02 4.93 0 .48.33 1.06 1.24.88C30.84 32.7 36 25.95 36 18 36 8.06 27.94 0 18 0z" transform="scale(0.95)"/>
  </g>

  <!-- Platform Details -->
  <text x="72" y="34" class="platform-name">GitHub</text>
  <text x="135" y="34" class="handle-text">moch-firmansyahh</text>

  <!-- Status indicator row -->
  <g transform="translate(72, 48)">
    <circle cx="4" cy="4" r="3" fill="#4ADE80"/>
    <circle cx="4" cy="4" r="5" fill="none" stroke="#4ADE80" stroke-width="1" stroke-opacity="0.5"/>
    <text x="14" y="8" class="status-text">CONNECTED</text>
  </g>

  <!-- Right Arrow Icon -->
  <g transform="translate(390, 27)" stroke="#38BDF8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="0" y1="16" x2="16" y2="0"/>
    <polyline points="4 0 16 0 16 12"/>
  </g>
</svg>
