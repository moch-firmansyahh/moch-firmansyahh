<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 60" width="100%" height="100%">
  <defs>
    <linearGradient id="arsenalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="35%" stop-color="#818CF8"/>
      <stop offset="70%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .arsenal-text {
      font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Courier New', sans-serif;
      font-weight: 900;
      letter-spacing: 4px;
      font-size: 20px;
      fill: #FFFFFF;
    }
    .mono {
      font-family: 'Courier New', monospace;
      font-size: 11px;
      letter-spacing: 2px;
      fill: #38BDF8;
      font-weight: 600;
    }
  </style>

  <!-- Left Tech Bracket Indicator -->
  <path d="M 5 12 L 0 12 L 0 35 L 5 35" fill="none" stroke="#38BDF8" stroke-width="2.5"/>
  <rect x="12" y="19" width="5" height="5" fill="#38BDF8"/>

  <!-- Title Text -->
  <text x="28" y="27" class="arsenal-text">ARSENAL</text>
  <text x="165" y="26" class="mono">// TECH_CAPABILITIES</text>

  <!-- Futuristic Gradient Underline -->
  <rect x="0" y="44" width="480" height="2.5" rx="1.25" fill="url(#arsenalGrad)" filter="url(#glow)"/>
  <rect x="0" y="44" width="480" height="2" rx="1" fill="url(#arsenalGrad)"/>
  
  <!-- Circuit Nodes -->
  <circle cx="485" cy="45" r="2.5" fill="#C084FC"/>
  <line x1="490" y1="45" x2="520" y2="45" stroke="#334155" stroke-width="1" stroke-dasharray="3, 3"/>
  <circle cx="525" cy="45" r="1.5" fill="#64748B"/>
</svg>
